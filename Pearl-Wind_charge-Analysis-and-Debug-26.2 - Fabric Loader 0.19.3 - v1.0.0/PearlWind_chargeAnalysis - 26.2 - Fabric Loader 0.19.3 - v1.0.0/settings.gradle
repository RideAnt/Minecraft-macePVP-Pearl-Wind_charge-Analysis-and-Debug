pluginManagement {
    repositories {
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

/*
 * Do NOT use RepositoriesMode.FAIL_ON_PROJECT_REPOS here.
 * Fabric Loom 1.14 adds an internal repository named LoomLocalRemappedMods
 * while the plugin is applied. FAIL_ON_PROJECT_REPOS makes Gradle 9 reject that.
 */
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)

    repositories {
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        mavenCentral()
    }
}

rootProject.name = "PearlWind_chargeAnalysis"
